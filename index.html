<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroTech - Premium E-Commerce Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 2rem; }

    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      flex-wrap: wrap;
    }

    .logo { font-size: 1.6rem; font-weight: 800; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
    .logo span { color: var(--primary); }

    .search-bar {
      display: flex; background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 0.5rem 1rem; width: 320px; align-items: center; gap: 0.5rem;
    }
    .search-bar input { background: transparent; border: none; color: #fff; outline: none; width: 100%; }

    .header-actions { display: flex; gap: 1rem; align-items: center; }

    .btn {
      background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem;
      border-radius: 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem;
      transition: 0.3s; text-decoration: none;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--card-bg); border-color: var(--primary); }
    .btn-accent { background: var(--accent); }
    .btn-accent:hover { background: #059669; }

    .container { max-width: 1280px; margin: 2rem auto; padding: 0 1rem; }

    .categories { display: flex; gap: 0.8rem; margin-bottom: 2rem; overflow-x: auto; padding-bottom: 0.5rem; }
    .cat-btn {
      background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border);
      padding: 0.6rem 1.4rem; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s;
    }
    .cat-btn.active, .cat-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }

    .product-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; position: relative;
    }
    .product-card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); }

    .product-img { width: 100%; height: 200px; object-fit: cover; background: #334155; cursor: pointer; }

    .product-info { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; cursor: pointer; }
    .product-title:hover { color: var(--primary); }
    .product-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price { font-size: 1.3rem; font-weight: 800; color: var(--accent); margin-bottom: 1rem; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
      z-index: 200; display: none; justify-content: center; align-items: center; padding: 1rem;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
      max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem; position: relative;
    }
    .close-modal { position: absolute; top: 1.2rem; right: 1.2rem; background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; }

    /* Product Detail Modal */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }
    .main-detail-img { width: 100%; height: 240px; object-fit: cover; border-radius: 12px; margin-bottom: 0.8rem; }
    .thumbs { display: flex; gap: 0.5rem; }
    .thumb-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .thumb-img.active { border-color: var(--primary); }

    /* Form controls */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
    .form-control {
      width: 100%; padding: 0.7rem 1rem; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: #fff; outline: none;
    }
    .form-control:focus { border-color: var(--primary); }

    /* Admin Panel Badge */
    .admin-badge { background: #8b5cf6; color: white; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; margin-left: 0.5rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="filterCategory('all')">
      <i class="fa-solid fa-bolt"></i> Electro<span>Tech</span>
      <span id="adminBadge" class="admin-badge" style="display:none;">ADMIN</span>
    </div>

    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
      <input type="text" id="searchInput" placeholder="Mahsulotlarni qidirish..." onkeyup="filterProducts()">
    </div>

    <div class="header-actions">
      <button class="btn btn-outline" id="loginBtn" onclick="openModal('loginModal')">
        <i class="fa-solid fa-user-lock"></i> Admin Panel
      </button>

      <button class="btn" id="adminAddBtn" onclick="openModal('addProductModal')" style="display:none; background:#8b5cf6;">
        <i class="fa-solid fa-plus"></i> Mahsulot Qo'shish
      </button>

      <button class="btn btn-outline" id="logoutBtn" onclick="logoutAdmin()" style="display:none; color:var(--danger); border-color:var(--danger);">
        <i class="fa-solid fa-right-from-bracket"></i> Chiqish
      </button>

      <button class="btn" onclick="openModal('cartModal')">
        <i class="fa-solid fa-cart-shopping"></i> Savatcha (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <div class="container">
    <div class="categories">
      <button class="cat-btn active" onclick="filterCategory('all', this)">Barchasi</button>
      <button class="cat-btn" onclick="filterCategory('phones', this)">Telefonlar</button>
      <button class="cat-btn" onclick="filterCategory('laptops', this)">Noutbuklar</button>
      <button class="cat-btn" onclick="filterCategory('audio', this)">Audio & Aksessuarlar</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="close-modal" onclick="closeModal('detailModal')">&times;</button>
      <div class="detail-grid">
        <div>
          <img id="detailMainImg" src="" class="main-detail-img" alt="">
          <div class="thumbs" id="detailThumbs"></div>
        </div>
        <div>
          <h2 id="detailTitle" style="margin-bottom: 0.5rem;"></h2>
          <div id="detailPrice" style="font-size: 1.5rem; color: var(--accent); font-weight: 800; margin-bottom: 1rem;"></div>
          <p id="detailDesc" style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;"></p>
          <button class="btn btn-accent" id="detailAddCartBtn" style="width: 100%;">
            <i class="fa-solid fa-cart-plus"></i> Savatchaga Qo'shish
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box" style="max-width: 400px;">
      <button class="close-modal" onclick="closeModal('loginModal')">&times;</button>
      <h2 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-lock"></i> Admin Tizimiga Kirish</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Admin Login</label>
          <input type="text" id="adminUser" class="form-control" placeholder="Loginni kiriting" required>
        </div>
        <div class="form-group">
          <label>Parol</label>
          <input type="password" id="adminPass" class="form-control" placeholder="Parolni kiriting" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Kirish</button>
      </form>
    </div>
  </div>

  <!-- Add Product Modal -->
  <div class="modal-overlay" id="addProductModal">
    <div class="modal-box">
      <button class="close-modal" onclick="closeModal('addProductModal')">&times;</button>
      <h2 style="margin-bottom: 1.5rem;">Yangi Mahsulot Qo'shish</h2>
      <form onsubmit="handleAddProduct(event)">
        <div class="form-group">
          <label>Mahsulot Nomi</label>
          <input type="text" id="pName" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Kategoriya</label>
          <select id="pCat" class="form-control" required>
            <option value="phones">Telefonlar</option>
            <option value="laptops">Noutbuklar</option>
            <option value="audio">Audio & Aksessuarlar</option>
          </select>
        </div>
        <div class="form-group">
          <label>Narxi ($)</label>
          <input type="number" id="pPrice" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Asosiy Rasm URL</label>
          <input type="url" id="pImg1" class="form-control" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label>Qo'shimcha Rasm 2 URL</label>
          <input type="url" id="pImg2" class="form-control" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Tavsifi</label>
          <textarea id="pDesc" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-accent" style="width: 100%;">Saqlash va Qo'shish</button>
      </form>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-box" style="max-width: 500px;">
      <button class="close-modal" onclick="closeModal('cartModal')">&times;</button>
      <h2 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-cart-shopping"></i> Savatchangiz</h2>
      <div id="cartItems" style="display: flex; flex-direction: column; gap: 1rem; max-height: 300px; overflow-y: auto; margin-bottom: 1.5rem;"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3>Jami Narx:</h3>
        <h2 style="color: var(--accent);">$<span id="cartTotal">0</span></h2>
      </div>
      <button class="btn btn-accent" style="width: 100%;" onclick="checkoutTelegram()">
        <i class="fa-paper-plane"></i> Telegram Orqali Buyurtma Berish
      </button>
    </div>
  </div>

  <script>
    const initialProducts = [
      { id: 1, name: "iPhone 15 Pro Max 256GB", price: 1199, category: "phones", images: ["https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600", "https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?w=600"], desc: "Titan korpus, A17 Pro chip, 48MP kamera tizimi hamda super yorqin OLED displey." },
      { id: 2, name: "MacBook Pro 16 M3 Max", price: 2899, category: "laptops", images: ["https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600", "https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?w=600"], desc: "36GB RAM, 1TB SSD. Professional va murakkab dasturlash topshiriqlari uchun yaratilgan." },
      { id: 3, name: "Sony WH-1000XM5 Wireless", price: 399, category: "audio", images: ["https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"], desc: "Sanoatdagi eng yaxshi shovqinni bosuvchi (Noise Cancelling) simsiz quloqchinlar." },
      { id: 4, name: "Samsung Galaxy S24 Ultra", price: 1299, category: "phones", images: ["https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=600"], desc: "Galaxy AI imkoniyatlari, S-Pen ruchkasi va 200MP sun'iy intellekt kamerasi." }
    ];

    let products = JSON.parse(localStorage.getItem('products_db')) || initialProducts;
    let cart = JSON.parse(localStorage.getItem('cart_db')) || [];
    let isAdmin = localStorage.getItem('isAdminLoggedIn') === 'true';

    function init() {
      checkAdminStatus();
      renderProducts(products);
      updateCartUI();
    }

    function renderProducts(items) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = items.map(p => `
        <div class="product-card">
          <img src="${p.images[0]}" class="product-img" onclick="openDetail(${p.id})">
          <div class="product-info">
            <div class="product-title" onclick="openDetail(${p.id})">${p.name}</div>
            <div class="product-desc">${p.desc}</div>
            <div class="product-price">$${p.price}</div>
            <div style="display: flex; gap: 0.5rem; margin-top: auto;">
              <button class="btn" style="flex: 1;" onclick="addToCart(${p.id})"><i class="fa-solid fa-cart-plus"></i></button>
              ${isAdmin ? `<button class="btn" style="background:var(--danger);" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const p = products.find(prod => prod.id === id);
      cart.push(p);
      localStorage.setItem('cart_db', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.length;
      document.getElementById('cartItems').innerHTML = cart.map((item, idx) => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:0.8rem; border-radius:10px;">
          <div>
            <b>${item.name}</b>
            <div style="color:var(--accent); font-weight:bold;">$${item.price}</div>
          </div>
          <button style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:1.1rem;" onclick="removeFromCart(${idx})"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('');
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cartTotal').innerText = total;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart_db', JSON.stringify(cart));
      updateCartUI();
    }

    function openDetail(id) {
      const p = products.find(prod => prod.id === id);
      document.getElementById('detailTitle').innerText = p.name;
      document.getElementById('detailPrice').innerText = `$${p.price}`;
      document.getElementById('detailDesc').innerText = p.desc;
      const mainImg = document.getElementById('detailMainImg');
      mainImg.src = p.images[0];

      const thumbs = document.getElementById('detailThumbs');
      thumbs.innerHTML = p.images.map((img, i) => `
        <img src="${img}" class="thumb-img ${i === 0 ? 'active' : ''}" onclick="document.getElementById('detailMainImg').src='${img}'">
      `).join('');

      document.getElementById('detailAddCartBtn').onclick = () => { addToCart(p.id); closeModal('detailModal'); };
      openModal('detailModal');
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    /* Admin Operations */
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      if(u === 'techadmin10' && p === 'z1zaludba20') {
        isAdmin = true;
        localStorage.setItem('isAdminLoggedIn', 'true');
        checkAdminStatus();
        closeModal('loginModal');
        renderProducts(products);
      } else {
        alert("Xato login yoki parol!");
      }
    }

    function checkAdminStatus() {
      if(isAdmin) {
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('adminAddBtn').style.display = 'inline-flex';
        document.getElementById('logoutBtn').style.display = 'inline-flex';
        document.getElementById('adminBadge').style.display = 'inline-block';
      } else {
        document.getElementById('loginBtn').style.display = 'inline-flex';
        document.getElementById('adminAddBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('adminBadge').style.display = 'none';
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.removeItem('isAdminLoggedIn');
      checkAdminStatus();
      renderProducts(products);
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const imgs = [document.getElementById('pImg1').value];
      if(document.getElementById('pImg2').value) imgs.push(document.getElementById('pImg2').value);

      const newP = {
        id: Date.now(),
        name: document.getElementById('pName').value,
        category: document.getElementById('pCat').value,
        price: parseFloat(document.getElementById('pPrice').value),
        images: imgs,
        desc: document.getElementById('pDesc').value
      };

      products.push(newP);
      localStorage.setItem('products_db', JSON.stringify(products));
      renderProducts(products);
      closeModal('addProductModal');
    }

    function deleteProduct(id) {
      if(confirm("Ushbu mahsulotni o'chirishga ishonchingiz komilmi?")) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('products_db', JSON.stringify(products));
        renderProducts(products);
      }
    }

    function filterCategory(cat, btn) {
      if(btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      if(cat === 'all') renderProducts(products);
      else renderProducts(products.filter(p => p.category === cat));
    }

    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(products.filter(p => p.name.toLowerCase().includes(q)));
    }

    function checkoutTelegram() {
      if(cart.length === 0) return alert("Savatchangiz bo'sh!");
      let text = "Salom! Men ElectroTech saytidan quyidagi mahsulotlarni sotib olmoqchiman:\n\n";
      cart.forEach((item, i) => text += `${i+1}. ${item.name} - $${item.price}\n`);
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      text += `\nJami: $${total}`;
      window.open(`https://t.me/ElectroTechAdmin?text=${encodeURIComponent(text)}`, '_blank');
    }

    init();
  </script>
</body>
</html>
